<text x="45" y="45" class="title">Figure 2. Original and current pipelines define non-equivalent analyses</text>
<rect x="35" y="75" width="240" height="55" fill="#e9eef3" stroke="#aeb7c2" stroke-width="1" rx="4"/>
<text x="47" y="109" class="head" text-anchor="start">Audit item</text>
<rect x="275" y="75" width="410" height="55" fill="#e9eef3" stroke="#aeb7c2" stroke-width="1" rx="4"/>
<text x="287" y="109" class="head" text-anchor="start">Han et al.</text>
<rect x="685" y="75" width="410" height="55" fill="#e9eef3" stroke="#aeb7c2" stroke-width="1" rx="4"/>
<text x="697" y="109" class="head" text-anchor="start">Current frozen analysis</text>
<rect x="1095" y="75" width="410" height="55" fill="#e9eef3" stroke="#aeb7c2" stroke-width="1" rx="4"/>
<text x="1107" y="109" class="head" text-anchor="start">Interpretation</text>
<rect x="35" y="130" width="240" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="130" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="130" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="130" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="158" class="body" text-anchor="start">cohort</text>
<text x="285" y="158" class="small" text-anchor="start">402 patients</text>
<text x="695" y="158" class="small" text-anchor="start">400 downloadable DNA runs; 2 records size_MB=0</text>
<text x="1105" y="158" class="small" text-anchor="start">Availability difference; not an independent cohort</text>
<rect x="35" y="212" width="240" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="212" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="212" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="212" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="240" class="body" text-anchor="start">analysis split</text>
<text x="285" y="240" class="small" text-anchor="start">Ecology n=284; models 284/118</text>
<text x="695" y="240" class="small" text-anchor="start">All n=400; permutations blocked within split</text>
<text x="1105" y="240" class="small" text-anchor="start">Different estimand and sample population</text>
<rect x="35" y="294" width="240" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="294" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="294" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="294" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="322" class="body" text-anchor="start">taxonomic classifier</text>
<text x="285" y="322" class="small" text-anchor="start">Kraken2 plus Bracken</text>
<text x="695" y="322" class="small" text-anchor="start">Kraken2 plus Bracken</text>
<text x="1105" y="322" class="small" text-anchor="start">Equivalence not established</text>
<rect x="35" y="376" width="240" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="376" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="376" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="376" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="404" class="body" text-anchor="start">database and versions</text>
<text x="285" y="404" class="small" text-anchor="start">Not fully specified/reconstructed</text>
<text x="695" y="404" class="small" text-anchor="start">Local database provenance differs or is separately</text>
<text x="695" y="426" class="small" text-anchor="start">recorded</text>
<text x="1105" y="404" class="small" text-anchor="start">Taxon discordance may be pipeline-driven</text>
<rect x="35" y="458" width="240" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="458" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="458" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="458" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="486" class="body" text-anchor="start">negative controls</text>
<text x="285" y="486" class="small" text-anchor="start">32 DNA and 32 RNA controls; operational</text>
<text x="285" y="508" class="small" text-anchor="start">rule unresolved</text>
<text x="695" y="486" class="small" text-anchor="start">No matched-control model; frozen label exclusions and</text>
<text x="695" y="508" class="small" text-anchor="start">QC flags</text>
<text x="1105" y="486" class="small" text-anchor="start">Low-biomass authenticity remains limited</text>
<rect x="35" y="540" width="240" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="540" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="540" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="540" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="568" class="body" text-anchor="start">normalization</text>
<text x="285" y="568" class="small" text-anchor="start">MPA combination; Homo removal; relative-abundance conversion</text>
<text x="695" y="568" class="small" text-anchor="start">Bracken fractions; exclusions and renormalization</text>
<text x="1105" y="568" class="small" text-anchor="start">Zeros and denominators differ</text>
<rect x="35" y="622" width="240" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="622" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="622" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="622" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="650" class="body" text-anchor="start">primary contrast</text>
<text x="285" y="650" class="small" text-anchor="start">Cancer versus infection and separate pairwise comparisons</text>
<text x="695" y="650" class="small" text-anchor="start">Four-level diagnosis omnibus</text>
<text x="1105" y="650" class="small" text-anchor="start">Not an exact reproduction</text>
<rect x="35" y="704" width="240" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="704" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="704" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="704" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="732" class="body" text-anchor="start">beta diversity</text>
<text x="285" y="732" class="small" text-anchor="start">Bray–Curtis</text>
<text x="695" y="732" class="small" text-anchor="start">Aitchison primary; Bray comparator</text>
<text x="1105" y="732" class="small" text-anchor="start">Methodological strengthening, not new biology</text>
<rect x="35" y="786" width="240" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="786" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="786" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="786" width="410" height="82" fill="#ffffff" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="814" class="body" text-anchor="start">dispersion</text>
<text x="285" y="814" class="small" text-anchor="start">No paired headline PERMDISP</text>
<text x="695" y="814" class="small" text-anchor="start">PERMDISP paired with every PERMANOVA</text>
<text x="1105" y="814" class="small" text-anchor="start">Supports genuine interpretation audit</text>
<rect x="35" y="868" width="240" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="275" y="868" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="685" y="868" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<rect x="1095" y="868" width="410" height="82" fill="#f8fafc" stroke="#d6dde5" stroke-width="1" rx="0"/>
<text x="45" y="896" class="body" text-anchor="start">differential taxa</text>
<text x="285" y="896" class="small" text-anchor="start">LEfSe, LDA&gt;2, adjusted P</text>
<text x="695" y="896" class="small" text-anchor="start">Kruskal–Wallis effect, blocked permutation, BH, CLR and</text>
<text x="695" y="918" class="small" text-anchor="start">QC sensitivity</text>
<text x="1105" y="896" class="small" text-anchor="start">List mismatch may be methodological</text>
<text x="45" y="985" class="small" text-anchor="start">Taxon overlap or mismatch is pipeline/statistical concordance or discrepancy, not biological agreement or disagreement.</text>
</svg>
