<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252b}.title{font-size:28px;font-weight:700}.panel{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#4b5563}.tiny{font-size:11px;fill:#4b5563}</style>
<text x="45" y="45" class="title">Figure 5. Supported conclusions and claim limits</text>
<rect x="45" y="90" width="430" height="730" fill="#e9f5ef" stroke="#217a4b" stroke-width="1.5" rx="6"/>
<text x="260" y="135" class="head" text-anchor="middle" style="fill:#217a4b">Supported within frozen pipeline</text>
<rect x="75" y="195" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="260" y="237" class="body" text-anchor="middle">Exact replay of the 30-species Aitchison</text>
<text x="260" y="263" class="body" text-anchor="middle">anchor</text>
<rect x="75" y="375" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="260" y="417" class="body" text-anchor="middle">Very small conditional diagnosis variance component</text>
<rect x="75" y="555" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="260" y="597" class="body" text-anchor="middle">Stability to two prespecified pseudocounts</text>
<rect x="515" y="90" width="430" height="730" fill="#fff5e8" stroke="#a35d00" stroke-width="1.5" rx="6"/>
<text x="730" y="135" class="head" text-anchor="middle" style="fill:#a35d00">Analytically dependent</text>
<rect x="545" y="195" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="730" y="237" class="body" text-anchor="middle">Effect-size estimate depends on feature space</text>
<text x="730" y="263" class="body" text-anchor="middle">and QC population</text>
<rect x="545" y="375" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="730" y="417" class="body" text-anchor="middle">Full-cohort Bray differences are dispersion-qualified</text>
<rect x="545" y="555" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="730" y="597" class="body" text-anchor="middle">Taxon overlap or mismatch is pipeline/statistical</text>
<text x="730" y="623" class="body" text-anchor="middle">only</text>
<rect x="985" y="90" width="430" height="730" fill="#fbecec" stroke="#a22b2b" stroke-width="1.5" rx="6"/>
<text x="1200" y="135" class="head" text-anchor="middle" style="fill:#a22b2b">Not supported</text>
<rect x="1015" y="195" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="1200" y="237" class="body" text-anchor="middle">Stable disease fingerprint or clinical subtype</text>
<rect x="1015" y="375" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="1200" y="417" class="body" text-anchor="middle">Biomarker or diagnostic signal</text>
<rect x="1015" y="555" width="370" height="125" fill="#ffffff" stroke="#d2d8df" stroke-width="1" rx="4"/>
<text x="1200" y="597" class="body" text-anchor="middle">Disease-specific taxon discovery or mechanism</text>
<text x="45" y="875" class="small" text-anchor="start">This is an analytical robustness audit. It does not reproduce the complete Han et al. workflow.</text>
